name: 'Setup crane'
description: 'Install and authorize crane'
branding:
  icon: box
  color: green
inputs:
  version:
    description: 'Version of crane to install (tip, latest-release, v0.5.1, etc.)'
    required: true
    default: 'latest-release'
runs:
  using: "composite"
  steps:
  - name: Subscription check
    env:
      REPO_PRIVATE: ${{ github.event.repository.private }}
    run: |
      # validate subscription status
      UPSTREAM="imjasonh/setup-crane"
      ACTION_REPO="${GITHUB_ACTION_REPOSITORY:-}"
      DOCS_URL="https://docs.stepsecurity.io/actions/stepsecurity-maintained-actions"

      echo ""
      echo -e "\033[1;36mStepSecurity Maintained Action\033[0m"
      echo "Secure drop-in replacement for $UPSTREAM"
      if [ "$REPO_PRIVATE" = "false" ]; then
        echo -e "\033[32m✓ Free for public repositories\033[0m"
      fi
      echo -e "\033[36mLearn more:\033[0m $DOCS_URL"
      echo ""

      if [ "$REPO_PRIVATE" != "false" ]; then
        SERVER_URL="${GITHUB_SERVER_URL:-https://github.com}"

        if [ "$SERVER_URL" != "https://github.com" ]; then
          BODY=$(printf '{"action":"%s","ghes_server":"%s"}' "$ACTION_REPO" "$SERVER_URL")
        else
          BODY=$(printf '{"action":"%s"}' "$ACTION_REPO")
        fi

        API_URL="https://agent.api.stepsecurity.io/v1/github/$GITHUB_REPOSITORY/actions/maintained-actions-subscription"

        RESPONSE=$(curl --max-time 3 -s -w "%{http_code}" \
          -X POST \
          -H "Content-Type: application/json" \
          -d "$BODY" \
          "$API_URL" -o /dev/null) && CURL_EXIT_CODE=0 || CURL_EXIT_CODE=$?

        if [ $CURL_EXIT_CODE -ne 0 ]; then
          echo "Timeout or API not reachable. Continuing to next step."
        elif [ "$RESPONSE" = "403" ]; then
          echo -e "::error::\033[1;31mThis action requires a StepSecurity subscription for private repositories.\033[0m"
          echo -e "::error::\033[31mLearn how to enable a subscription: $DOCS_URL\033[0m"
          exit 1
        fi
      fi
    shell: bash
  - shell: bash
    env:
      VERSION: ${{ inputs.version }}
      RUNNER_OS: ${{ runner.os }}
      GITHUB_TOKEN: ${{ github.token }}
    run: |
      set -ex

      # Install crane:
      # - if version is "tip", install from tip of main.
      # - if version is "latest-release", use the latest release URL.
      # - otherwise, install the specified version.
      case "${VERSION}" in
      tip)
        echo "Installing crane using go get"
        go install github.com/google/go-containerregistry/cmd/crane@main
        ;;
      latest-release)
        url="https://github.com/google/go-containerregistry/releases/latest/download"
        ;;
      *)
        url="https://github.com/google/go-containerregistry/releases/download/${VERSION}"
      esac

      os="${RUNNER_OS}"
      if [[ "$os" == "macOS" ]]; then
        os="Darwin"
      fi

      arch=$(uname -m)
      if [[ "$arch" =~ (aarch64|arm64) ]] ; then
        arch=arm64
      fi

      out=crane
      if [[ "${os}" == "Windows" ]]; then
        out=crane.exe
      fi

      if [[ ! -z "${url}" ]]; then
        echo "Installing crane for ${os} on ${arch}"
        tmp=$(mktemp -d)
        cd "${tmp}"
        fname="go-containerregistry_${os}_${arch}.tar.gz"
        curl -o "$fname" -fsSL --retry 5 --retry-delay 1 --retry-all-errors "${url}/${fname}"
        curl -o checksums.txt -fsSL --retry 5 --retry-delay 1 --retry-all-errors "${url}/checksums.txt"
        if command -v sha256sum &>/dev/null; then
          grep "${fname}" checksums.txt | sha256sum --check
        else
          grep "${fname}" checksums.txt | shasum -a 256 --check
        fi
        tar xzf "$fname" "${out}"
        chmod +x "${tmp}/${out}"
        PATH="${PATH}:${tmp}"
        echo "${tmp}" >> "$GITHUB_PATH"
      fi

      # NB: username doesn't seem to matter.
      echo "${GITHUB_TOKEN}" | crane auth login ghcr.io --username "dummy" --password-stdin
