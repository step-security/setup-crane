name: Use Action

on:
  pull_request:
    branches: ['main']
  push:
    branches: ['main']

permissions: {}

jobs:
  use-action:
    name: Use Action
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ github.actor == 'dependabot[bot]' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        shell: bash
        
    permissions:
      packages: write

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.25.x
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./
      - run: |
          crane digest ubuntu
          crane manifest ubuntu | jq
      - if: github.event_name == 'push'
        run: |
          crane copy ubuntu ghcr.io/${{ github.repository }}/ubuntu-copy

      - name: Install old release
        uses: ./
        with:
          version: v0.12.0
      - name: Check installed version
        run: crane version | grep 0.12.0

      - name: Install from tip
        uses: ./
        with:
          version: tip
      - name: Check installed version (tip)
        run: |
          rm $(which crane) # Uninstall previous versions.
          crane version
